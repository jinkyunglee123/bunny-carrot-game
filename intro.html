<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토끼의 당근 피하기 - 소개</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #2b2320;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #film { display: block; border-radius: 12px; }
  #endButtons {
    position: absolute;
    left: 0; right: 0; bottom: 4%;
    display: flex;
    justify-content: center;
    gap: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s;
  }
  #endButtons.show { opacity: 1; pointer-events: auto; }
  #endButtons button, #endButtons a {
    font-family: inherit;
    font-size: 16px; font-weight: 800;
    padding: 10px 20px;
    border-radius: 999px;
    border: 2px solid #fff;
    background: rgba(255, 255, 255, .85);
    color: #6b4a2b;
    text-decoration: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="film"></canvas>
  <div id="endButtons">
    <button id="replayBtn" type="button">다시 보기</button>
    <a href="index.html">게임 하러 가기</a>
  </div>
</div>

<script>
(() => {
  'use strict';

  // 세로 9:16 화면을 기준 좌표로 그리고, 창 크기에 맞춰 늘이거나 줄임
  const LW = 720, LH = 1280;
  const DURATION = 10;
  const GROUND = 1110;

  const canvas = document.getElementById('film');
  const ctx = canvas.getContext('2d');
  const endButtons = document.getElementById('endButtons');
  let k = 1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    k = Math.min(window.innerWidth / LW, window.innerHeight / LH);
    canvas.style.width = LW * k + 'px';
    canvas.style.height = LH * k + 'px';
    canvas.width = Math.round(LW * k * dpr);
    canvas.height = Math.round(LH * k * dpr);
    ctx.setTransform(k * dpr, 0, 0, k * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- 움직임 곡선 ----------
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const progress = (t, start, len) => clamp01((t - start) / len);
  const easeInOut = (p) => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  const easeIn = (p) => p * p;
  const easeOutBack = (p) => {
    const c1 = 1.9, c3 = c1 + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
  };
  const easeOutElastic = (p) => {
    if (p === 0 || p === 1) return p;
    return Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
  };

  // 시간표: [시간, x] 사이를 부드럽게 이어 줌
  function track(keys, t) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const [t0, v0] = keys[i - 1];
        const [t1, v1] = keys[i];
        return lerp(v0, v1, easeInOut((t - t0) / (t1 - t0)));
      }
    }
    return keys[keys.length - 1][1];
  }

  // ---------- 장면 데이터 ----------
  const TITLE_LINES = [
    { text: '토끼의', y: 250, size: 96, start: 0.2 },
    { text: '당근 피하기', y: 370, size: 112, start: 0.55 },
  ];

  // 당근: 떨어지기 시작하는 시간과 위치
  const CARROTS = [
    { x: 200, t0: 5.6 }, { x: 540, t0: 5.9 }, { x: 360, t0: 6.3 },
    { x: 110, t0: 6.7 }, { x: 610, t0: 7.0 }, { x: 230, t0: 7.3 },
    { x: 570, t0: 7.6 },
  ];
  const FALL_SEC = 1.4;

  // 토끼가 당근 사이를 피해 다니는 경로 (5.8초 이후)
  const DODGE = [[5.8, 360], [7.1, 360], [7.35, 240], [7.95, 240], [8.2, 370]];

  // ---------- 그리기 도구 ----------
  function ellipse(x, y, rx, ry, rot, fill, stroke, lw) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw || 3; ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground(t) {
    const g = ctx.createLinearGradient(0, 0, 0, LH);
    g.addColorStop(0, '#9fdcff');
    g.addColorStop(0.7, '#e3f6ff');
    g.addColorStop(1, '#fff3e0');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, LW, LH);

    // 햇살
    ctx.save();
    ctx.translate(600, 120);
    ctx.rotate(t * 0.15);
    ctx.fillStyle = 'rgba(255, 236, 150, .35)';
    for (let i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-18, 200);
      ctx.lineTo(18, 200);
      ctx.fill();
    }
    ctx.restore();
    ellipse(600, 120, 60, 60, 0, '#ffe27a', '#ffc94a', 4);

    // 천천히 흐르는 구름
    const cloud = (x, y, s) => {
      x = ((x % (LW + 300)) + LW + 300) % (LW + 300) - 150;
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.beginPath();
      ctx.arc(x, y, 32 * s, 0, Math.PI * 2);
      ctx.arc(x + 36 * s, y - 16 * s, 40 * s, 0, Math.PI * 2);
      ctx.arc(x + 80 * s, y, 30 * s, 0, Math.PI * 2);
      ctx.fill();
    };
    cloud(60 + t * 18, 540, 1);
    cloud(420 + t * 12, 660, 0.8);
    cloud(250 + t * 25, 470, 0.6);

    // 언덕과 땅
    ctx.fillStyle = '#b6e59a';
    ctx.beginPath();
    ctx.moveTo(0, GROUND - 40);
    ctx.quadraticCurveTo(180, GROUND - 130, 380, GROUND - 50);
    ctx.quadraticCurveTo(560, GROUND - 120, LW, GROUND - 60);
    ctx.lineTo(LW, LH);
    ctx.lineTo(0, LH);
    ctx.fill();
    ctx.fillStyle = '#8fd16e';
    ctx.fillRect(0, GROUND, LW, LH - GROUND);
    ctx.fillStyle = '#7cc25c';
    ctx.fillRect(0, GROUND, LW, 6);
  }

  function drawRabbit(x, y, s, runPhase, lean) {
    const line = '#bba897';
    const legA = Math.sin(runPhase) * 10 * s;
    const earBack = runPhase ? Math.sin(runPhase * 0.5) * 0.08 : 0;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(lean);
    // 귀
    ellipse(-9 * s, -42 * s, 7 * s, 19 * s, -0.18 - earBack, '#fff', line, 3);
    ellipse(9 * s, -42 * s, 7 * s, 19 * s, 0.18 - earBack, '#fff', line, 3);
    ellipse(-9 * s, -41 * s, 3.5 * s, 13 * s, -0.18 - earBack, '#ffc1d0');
    ellipse(9 * s, -41 * s, 3.5 * s, 13 * s, 0.18 - earBack, '#ffc1d0');
    // 몸
    ellipse(0, 6 * s, 22 * s, 17 * s, 0, '#fff', line, 3);
    // 발 (달릴 때 번갈아 움직임)
    ellipse(-12 * s + legA * 0.4, 20 * s - Math.max(0, legA) * 0.5, 8 * s, 4.5 * s, 0, '#fff', line, 3);
    ellipse(12 * s - legA * 0.4, 20 * s - Math.max(0, -legA) * 0.5, 8 * s, 4.5 * s, 0, '#fff', line, 3);
    // 머리
    ellipse(0, -15 * s, 18 * s, 16 * s, 0, '#fff', line, 3);
    ellipse(-10 * s, -10 * s, 4 * s, 2.6 * s, 0, 'rgba(255,140,170,.45)');
    ellipse(10 * s, -10 * s, 4 * s, 2.6 * s, 0, 'rgba(255,140,170,.45)');
    ellipse(-6.5 * s, -17 * s, 2.6 * s, 3.2 * s, 0, '#2b2320');
    ellipse(6.5 * s, -17 * s, 2.6 * s, 3.2 * s, 0, '#2b2320');
    ellipse(-5.7 * s, -18.2 * s, 0.9 * s, 0.9 * s, 0, '#fff');
    ellipse(7.3 * s, -18.2 * s, 0.9 * s, 0.9 * s, 0, '#fff');
    ellipse(0, -11.5 * s, 2.4 * s, 1.8 * s, 0, '#ff8fa8');
    ctx.strokeStyle = '#8a6a5a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -10 * s);
    ctx.quadraticCurveTo(-2 * s, -7 * s, -4 * s, -8 * s);
    ctx.moveTo(0, -10 * s);
    ctx.quadraticCurveTo(2 * s, -7 * s, 4 * s, -8 * s);
    ctx.stroke();
    ctx.restore();
  }

  function drawCarrot(x, y, s, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ellipse(-6 * s, -20 * s, 4 * s, 10 * s, -0.5, '#4caf50', '#2e7d32', 2);
    ellipse(6 * s, -20 * s, 4 * s, 10 * s, 0.5, '#4caf50', '#2e7d32', 2);
    ellipse(0, -22 * s, 4 * s, 11 * s, 0, '#66bb6a', '#2e7d32', 2);
    ctx.beginPath();
    ctx.moveTo(-11 * s, -12 * s);
    ctx.quadraticCurveTo(0, -18 * s, 11 * s, -12 * s);
    ctx.quadraticCurveTo(6 * s, 10 * s, 0, 28 * s);
    ctx.quadraticCurveTo(-6 * s, 10 * s, -11 * s, -12 * s);
    ctx.closePath();
    ctx.fillStyle = '#ff8c2a';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#d9661a';
    ctx.stroke();
    ctx.strokeStyle = 'rgba(160,70,10,.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-7 * s, -3 * s); ctx.lineTo(-1 * s, -2 * s);
    ctx.moveTo(2 * s, 6 * s); ctx.lineTo(6 * s, 7 * s);
    ctx.moveTo(-4 * s, 14 * s); ctx.lineTo(0, 15 * s);
    ctx.stroke();
    ctx.restore();
  }

  function drawPuff(x, y, r, alpha) {
    ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.arc(x + r * 0.8, y - r * 0.3, r * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---------- 장면 ----------
  // 1) 제목이 글자마다 튀어나옴 (0.2초~)
  function drawTitle(t) {
    for (const line of TITLE_LINES) {
      ctx.font = '900 ' + line.size + 'px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      const chars = Array.from(line.text);
      const widths = chars.map((c) => ctx.measureText(c).width);
      const total = widths.reduce((a, b) => a + b, 0);
      let cx = LW / 2 - total / 2;
      chars.forEach((ch, i) => {
        const w = widths[i];
        const p = progress(t, line.start + i * 0.07, 0.9);
        if (p > 0 && ch !== ' ') {
          const sc = easeOutElastic(p);
          const bob = t > 2 ? Math.sin(t * 3 + i * 0.6) * 6 : 0;
          ctx.save();
          ctx.translate(cx + w / 2, line.y + bob);
          ctx.scale(sc, sc);
          ctx.lineJoin = 'round';
          ctx.lineWidth = 18;
          ctx.strokeStyle = '#fff';
          ctx.strokeText(ch, 0, 0);
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#a8501a';
          ctx.strokeText(ch, 0, 0);
          ctx.fillStyle = i % 2 ? '#ff9a3c' : '#ff7a1a';
          ctx.fillText(ch, 0, 0);
          ctx.restore();
        }
        cx += w;
      });
    }
  }

  // 2) 토끼: 왼쪽→오른쪽으로 가로질러 달리고, 다시 들어와 당근을 피함
  function rabbitPose(t) {
    const s = 3.2;
    const baseY = GROUND - 22 * s;
    if (t < 1.6) return null;
    if (t < 4.6) {
      // 가로지르기
      const p = (t - 1.6) / 3.0;
      const x = lerp(-120, LW + 120, p);
      const phase = t * 16;
      return { x, y: baseY - Math.abs(Math.sin(phase)) * 40, s, phase, lean: 0.12, dust: 1 };
    }
    if (t < 5.8) {
      // 오른쪽에서 가운데로 깡충깡충 돌아옴
      const p = easeInOut(progress(t, 4.8, 1.0));
      const x = lerp(LW + 120, 360, p);
      const phase = t * 12;
      const hop = p < 1 ? Math.abs(Math.sin(phase)) * 50 : 0;
      return { x, y: baseY - hop, s, phase: p < 1 ? phase : 0, lean: p < 1 ? -0.1 : 0, dust: p < 1 ? -1 : 0 };
    }
    // 당근 피하기와 마무리
    const x = track(DODGE, t);
    const moving = DODGE.some((d, i) => i > 0 && t > DODGE[i - 1][0] && t < d[0] && d[1] !== DODGE[i - 1][1]);
    const hop = moving ? Math.abs(Math.sin(t * 14)) * 45 : Math.abs(Math.sin(t * 5)) * 12;
    return { x, y: baseY - hop, s, phase: moving ? t * 14 : 0, lean: 0, dust: 0 };
  }

  function drawRunner(t) {
    const r = rabbitPose(t);
    if (!r) return;
    // 그림자
    const shadowScale = 1 - (GROUND - 22 * r.s - r.y) / 200;
    ellipse(r.x, GROUND + 2, 70 * shadowScale, 12 * shadowScale, 0, 'rgba(0,0,0,.13)');
    // 달릴 때 뒤로 남는 먼지
    if (r.dust) {
      for (let i = 0; i < 3; i++) {
        const age = ((t * 4 + i / 3) % 1);
        drawPuff(r.x - r.dust * (80 + age * 120), GROUND - 10 - age * 30, 18 * (1 - age * 0.5), (0.8 * (1 - age)).toFixed(2));
      }
    }
    drawRabbit(r.x, r.y, r.s, r.phase, r.lean);
  }

  // 3) 당근이 떨어지고, 땅에 닿으면 펑
  function drawCarrots(t) {
    for (const c of CARROTS) {
      const p = (t - c.t0) / FALL_SEC;
      if (p < 0) continue;
      if (p <= 1) {
        const y = lerp(-80, GROUND - 40, easeIn(p));
        drawCarrot(c.x, y, 2.4, Math.sin((t - c.t0) * 5) * 0.25 + Math.PI * 0.02);
      } else {
        const q = (t - c.t0 - FALL_SEC) / 0.45;
        if (q < 1) {
          ctx.save();
          ctx.globalAlpha = 1 - q;
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI - Math.PI;
            const d = 20 + q * 70;
            ellipse(c.x + Math.cos(a) * d, GROUND - 20 + Math.sin(a) * d * 0.7, 9, 9, 0, i % 2 ? '#ff8c2a' : '#ffd08a');
          }
          ctx.restore();
        }
      }
    }
  }

  // 4) '지금 플레이' 버튼이 튀어나와 깜빡임 (8.0초~)
  function drawPlayNow(t) {
    const start = 8.0;
    if (t < start) return;
    const p = progress(t, start, 0.6);
    const sc = easeOutBack(p);
    // 튀어나온 뒤 0.25초 간격으로 깜빡임
    const blinkT = t - start - 0.6;
    const on = blinkT < 0 || Math.floor(blinkT / 0.25) % 2 === 0;
    const glow = 0.5 + 0.5 * Math.sin(t * 8);

    ctx.save();
    ctx.translate(LW / 2, 760);
    ctx.scale(sc, sc);
    ctx.globalAlpha = on ? 1 : 0.15;
    ctx.shadowColor = 'rgba(255, 160, 40, ' + (0.4 + glow * 0.5).toFixed(2) + ')';
    ctx.shadowBlur = 30 + glow * 20;
    roundRect(-230, -70, 460, 140, 70);
    ctx.fillStyle = '#ff7a1a';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
    ctx.font = '900 76px system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText('지금 플레이', 0, 4);
    ctx.restore();
  }

  // 화면 전체 페이드 (시작할 때 밝아짐)
  function drawFade(t) {
    const a = 1 - progress(t, 0, 0.4);
    if (a > 0) {
      ctx.fillStyle = 'rgba(255, 248, 236, ' + a.toFixed(2) + ')';
      ctx.fillRect(0, 0, LW, LH);
    }
  }

  function render(t) {
    drawBackground(t);
    drawCarrots(t);
    drawRunner(t);
    drawTitle(t);
    drawPlayNow(t);
    drawFade(t);
  }

  // ---------- 재생 ----------
  // 다른 탭에 다녀와도 건너뛰지 않도록 프레임 간격을 짧게 제한해서 시간을 쌓음
  let t = 0;
  let last = 0;
  function frame(now) {
    if (last) t += Math.min(0.1, (now - last) / 1000);
    last = now;
    render(t);
    endButtons.classList.toggle('show', t >= DURATION);
    requestAnimationFrame(frame);
  }

  document.getElementById('replayBtn').addEventListener('click', () => { t = 0; });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
